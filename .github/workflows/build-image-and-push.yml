name: Memos Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: terraform-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: memos

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::409987738946:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --no-cache -f Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  terraform-plan:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::409987738946:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./infra/Main
        run: terraform init

      - name: Terraform Format
        working-directory: ./infra/Main
        run: terraform fmt 

      - name: Terraform Validate
        working-directory: ./infra/Main
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./infra/Main
        run: terraform plan -var="image_tag=${{ github.sha }}" -lock-timeout=5m

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ./infra/Main/tfplan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::409987738946:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./infra/Main
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v8.0.1
        with:
          name: tfplan
          path: ./infra/Main

      - name: Terraform Apply
        working-directory: ./infra/Main
        run: terraform apply -auto-approve tfplan -lock-timeout=5m

        
  verify-deploy:
    runs-on: ubuntu-latest
    needs: terraform-plan

    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::409987738946:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for ECS and Health Check
        run: |
          aws ecs wait services-stable \
            --cluster memos-ecs-cluster \
            --services memos-service

          curl --fail https://tm.ahmedo.co.uk